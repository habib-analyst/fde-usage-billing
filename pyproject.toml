[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-usage-billing"
version = "0.1.0"
description = "Usage metering and billing engine for multi-tenant SaaS: idempotent ingestion, versioned price book, Decimal-exact invoicing, proration, and a Stripe-shaped export adapter against a local test-mode fixture server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
